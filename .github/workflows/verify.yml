name: Verify frontend and backend

on:
  push:
    branches: [onsite-main-dev]
  pull_request:
    branches: [onsite-main, onsite-main-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on ${{ matrix.os }} (Node 20)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      TZ: Asia/Taipei
      NG_CLI_ANALYTICS: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            angular-client/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: angular-client

      # Tests generate synthetic users/data and temporary databases; smoke starts
      # its own local server with random test secrets and the scheduler disabled.
      - name: Check syntax, test, build, and run isolated smoke tests
        run: npm run verify
