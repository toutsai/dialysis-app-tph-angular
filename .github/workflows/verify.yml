name: Verify development changes

on:
  push:
    branches: [onsite-main-dev]
  pull_request:
    branches: [onsite-main, onsite-main-dev]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            angular-client/package-lock.json
      - run: npm ci
      - run: npm ci --prefix angular-client
      - run: npm run check:syntax
      - run: npm test
      - run: npm run build:angular
      - run: npm run smoke:tph-angular

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            angular-client/package-lock.json
      - run: npm ci
      - run: npm ci --prefix angular-client
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: npm run build:angular
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-synthetic-evidence
          path: output/playwright/results
          if-no-files-found: ignore
          retention-days: 7
