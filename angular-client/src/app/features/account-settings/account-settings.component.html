<div class="page-wrapper">
  <div class="settings-card">
    <header class="card-header">
      <h1 class="page-title">帳號設定</h1>
      @if (currentUser()) {
        <p class="subtitle">
          為帳號 <span class="username">{{ currentUser()!.name }}</span> 更改密碼
        </p>
      }
    </header>

    <p id="password-requirements">新密碼至少 8 個字元，包含大寫字母、小寫字母與數字；可用符號為 @$!%*?&，不接受空白或其他符號。</p>
    <form (ngSubmit)="handleChangePassword()" class="password-form">
      <div class="form-group">
        <label for="old-password">舊密碼</label>
        <div class="password-wrapper">
          <input
            id="old-password"
            [type]="isOldPasswordVisible() ? 'text' : 'password'"
            [ngModel]="oldPassword()"
            (ngModelChange)="oldPassword.set($event)"
            name="oldPassword"
            required
            autocomplete="current-password"
            />
            <button type="button" class="password-toggle-icon" (click)="togglePasswordVisibility('old')" [attr.aria-pressed]="isOldPasswordVisible()" [attr.aria-label]="isOldPasswordVisible() ? '隱藏舊密碼' : '顯示舊密碼'">
              {{ isOldPasswordVisible() ? '🙈' : '👁️' }}
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="new-password">新密碼</label>
          <div class="password-wrapper">
            <input
              id="new-password"
              [type]="isNewPasswordVisible() ? 'text' : 'password'"
              [ngModel]="newPassword()"
              (ngModelChange)="newPassword.set($event)"
              name="newPassword"
              required
              autocomplete="new-password" aria-describedby="password-requirements"
              />
              <button type="button" class="password-toggle-icon" (click)="togglePasswordVisibility('new')" [attr.aria-pressed]="isNewPasswordVisible()" [attr.aria-label]="isNewPasswordVisible() ? '隱藏新密碼' : '顯示新密碼'">
                {{ isNewPasswordVisible() ? '🙈' : '👁️' }}
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="confirm-password">確認新密碼</label>
            <div class="password-wrapper">
              <input
                id="confirm-password"
                [type]="isConfirmPasswordVisible() ? 'text' : 'password'"
                [ngModel]="confirmPassword()"
                (ngModelChange)="confirmPassword.set($event)"
                name="confirmPassword"
                required
                autocomplete="new-password"
                />
                <button type="button" class="password-toggle-icon" (click)="togglePasswordVisibility('confirm')" [attr.aria-pressed]="isConfirmPasswordVisible()" [attr.aria-label]="isConfirmPasswordVisible() ? '隱藏確認新密碼' : '顯示確認新密碼'">
                  {{ isConfirmPasswordVisible() ? '🙈' : '👁️' }}
                </button>
              </div>
            </div>

            <div class="form-actions">
              <button type="button" class="btn-cancel" (click)="handleCancel()">取消</button>
              <button type="submit" class="submit-btn" [disabled]="isLoading()">
                {{ isLoading() ? '處理中...' : '確認更改' }}
              </button>
            </div>

            @if (message()) {
              <p class="message" [ngClass]="messageType()">
                {{ message() }}
              </p>
            }
          </form>
        </div>
      </div>
