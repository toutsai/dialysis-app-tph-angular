@if (isVisible) {
  <div class="dialog-overlay" (click)="onClose()">
    <div class="dialog-content" (click)="$event.stopPropagation()">
      <header class="dialog-header">
        <h2>發起新的預約變更</h2>
        <button class="close-button" (click)="onClose()">×</button>
      </header>
      <main class="dialog-body">
        <p class="usage-hint">
          💡 今天發生的異動（今日出院、急診轉住院…）請直接在「病人清單」或「床位總表」操作即可——今日排程不會被影響，明日起自動更新。此處僅用於預約「未來日期」才生效的變更。
        </p>
        <fieldset class="step-group">
          <legend>步驟 1: 選擇變更類型</legend>
          <div class="form-group">
            <select [(ngModel)]="selectedChangeType" (ngModelChange)="onChangeTypeChange()">
              <option disabled value="">請選擇...</option>
              <option value="UPDATE_STATUS">變更身分別/病房號</option>
              <option value="UPDATE_MODE">變更透析模式</option>
              <option value="UPDATE_BASE_SCHEDULE_RULE">變更透析頻率/班別/床位</option>
              <option value="DELETE_PATIENT">預約刪除（出院/轉出）</option>
              <option value="RESTORE_PATIENT">預約復原病人</option>
            </select>
          </div>
        </fieldset>

        <fieldset class="step-group" [class.disabled]="!selectedChangeType">
          <legend>步驟 2: 選擇病人</legend>
          <button
            class="select-btn"
            (click)="isPatientDialogVisible = true"
            [disabled]="!selectedChangeType"
          >
            @if (selectedPatient) {
              <span>{{ selectedPatient.name }} ({{ selectedPatient.medicalRecordNumber }})</span>
            } @else {
              <span class="text-muted">點擊以選擇病人...</span>
            }
          </button>
        </fieldset>
      </main>
      <footer class="dialog-footer">
        <button class="btn btn-primary" (click)="handleContinue()" [disabled]="!isValid">下一步</button>
        <button class="btn btn-secondary" (click)="onClose()">取消</button>
      </footer>
    </div>
  </div>
}

<app-patient-select-dialog
  [isVisible]="isPatientDialogVisible"
  [patients]="allPatients"
  [showFillOptions]="false"
  [title]="patientDialogTitle"
  [patientStatusFilter]="patientDialogFilter"
  (confirm)="handlePatientSelected($event)"
  (cancel)="isPatientDialogVisible = false"
></app-patient-select-dialog>
