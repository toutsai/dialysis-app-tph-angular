<div class="edu-overlay" (click)="onClose()">
  <div class="edu-modal" (click)="$event.stopPropagation()">
    <div class="edu-header">
      <h3>
        <i class="fas fa-chalkboard-teacher"></i>
        初透病人衛教紀錄
        <span class="edu-sub" *ngIf="patientName">— {{ patientName }}<ng-container *ngIf="medicalRecordNumber">（{{ medicalRecordNumber }}）</ng-container></span>
      </h3>
      <div class="edu-header-actions">
        <span class="edu-progress" *ngIf="!isLoading()">已完成 {{ completedCount }}/12</span>
        <button class="edu-btn edu-btn-light" (click)="print()" [disabled]="isLoading()">
          <i class="fas fa-print"></i> 列印
        </button>
        <button class="edu-btn edu-btn-primary" *ngIf="canEdit" (click)="save()" [disabled]="isLoading() || isSaving()">
          <i class="fas fa-save"></i> {{ isSaving() ? '儲存中...' : '儲存' }}
        </button>
        <button class="edu-close" (click)="onClose()" title="關閉"><i class="fas fa-times"></i></button>
      </div>
    </div>

    <div class="edu-meta" *ngIf="!isLoading()">
      <span class="edu-meta-field">
        入院日期：
        <input type="date" class="edu-meta-input" [(ngModel)]="admissionDate" [disabled]="!canEdit" />
      </span>
      <span *ngIf="firstDialysisDate">首透日期：{{ firstDialysisDate }}</span>
    </div>

    <div class="edu-body">
      <div *ngIf="isLoading()" class="edu-loading">
        <div class="spinner"></div><p>載入中...</p>
      </div>

      <table *ngIf="!isLoading()" class="edu-table">
        <thead>
          <tr>
            <th class="col-idx">次數</th>
            <th class="col-date">透析日期</th>
            <th>主題</th>
            <th class="col-sign-cell">衛教者/日期</th>
            <th class="col-sign">被衛教者簽名</th>
            <th class="col-sign-cell">回示教日期/護理師</th>
            <th class="col-sign-cell">回示教通過日/主護簽章</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let s of sessions()" [class.row-alert]="needsAttention(s)">
            <td class="col-idx">{{ s.index }}</td>
            <td class="col-date">
              <input type="date" [(ngModel)]="s.dialysisDate" [disabled]="!canEdit" />
            </td>
            <td>
              <select class="topic-select" [(ngModel)]="s.topic" [disabled]="!canEdit">
                <option value="">（請選擇主題）</option>
                <option *ngFor="let t of topics()" [value]="t">{{ t }}</option>
                <option *ngIf="s.topic && !topics().includes(s.topic)" [value]="s.topic">{{ s.topic }}</option>
              </select>
            </td>
            <td class="col-sign-cell">
              <button type="button" class="sign-cell" [class.signed]="s.educatorSign" [disabled]="!canEdit"
                      (click)="toggleSign(s, 'educatorSign')"
                      [title]="s.educatorSign ? '點選取消簽核' : '點選簽核（蓋章＝您的姓名＋今日）'">
                {{ s.educatorSign ? signLabel(s.educatorSign) : '點選簽核' }}
              </button>
            </td>
            <td class="col-sign">
              <button type="button" class="sig-btn" [class.has-sig]="!!s.signature" [disabled]="!canEdit"
                      (click)="openSignPad(s)"
                      [title]="canEdit ? '點選開啟簽名板讓病人簽名' : ''">
                <img *ngIf="isImageSig(s.signature)" [src]="s.signature" class="sig-thumb" alt="簽名" />
                <span *ngIf="!isImageSig(s.signature) && s.signature" class="sig-text">{{ s.signature }}</span>
                <span *ngIf="!s.signature" class="sig-placeholder"><i class="fas fa-pen-nib"></i> 點選簽名</span>
              </button>
            </td>
            <td class="col-sign-cell">
              <button type="button" class="sign-cell" [class.signed]="s.returnDemoSign" [disabled]="!canEdit"
                      (click)="toggleSign(s, 'returnDemoSign')"
                      [title]="s.returnDemoSign ? '點選取消簽核' : '點選簽核（蓋章＝您的姓名＋今日）'">
                {{ s.returnDemoSign ? signLabel(s.returnDemoSign) : '點選簽核' }}
              </button>
            </td>
            <td class="col-sign-cell">
              <button type="button" class="sign-cell" [class.signed]="s.passSign" [disabled]="!canEdit"
                      (click)="toggleSign(s, 'passSign')"
                      [title]="s.passSign ? '點選取消簽核' : '點選簽核（蓋章＝您的姓名＋今日）'">
                {{ s.passSign ? signLabel(s.passSign) : '點選簽核' }}
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 被衛教者手寫簽名板（平板觸控） -->
  <div class="sig-overlay" *ngIf="signPadVisible()" (click)="closeSignPad()">
    <div class="sig-pad" (click)="$event.stopPropagation()">
      <div class="sig-pad-header">
        <span><i class="fas fa-pen-nib"></i> 被衛教者簽名<ng-container *ngIf="patientName"> — {{ patientName }}</ng-container></span>
        <button class="edu-close" (click)="closeSignPad()" title="關閉"><i class="fas fa-times"></i></button>
      </div>
      <div class="sig-canvas-wrap">
        <canvas #sigCanvas class="sig-canvas"
                (pointerdown)="onSigDown($event)"
                (pointermove)="onSigMove($event)"
                (pointerup)="onSigUp()"
                (pointercancel)="onSigUp()"
                (pointerleave)="onSigUp()"></canvas>
      </div>
      <p class="sig-hint">請用觸控筆或手指於上方白色區域簽名，完成後按「確認」。</p>
      <div class="sig-pad-actions">
        <button class="edu-btn edu-btn-light" (click)="clearSig()"><i class="fas fa-eraser"></i> 清除</button>
        <button class="edu-btn edu-btn-light" (click)="closeSignPad()">取消</button>
        <button class="edu-btn edu-btn-primary" (click)="confirmSig()"><i class="fas fa-check"></i> 確認</button>
      </div>
    </div>
  </div>
</div>
